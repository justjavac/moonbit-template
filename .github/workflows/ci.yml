name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Update codegen dependencies
        run: moon -C template_codegen update

      - name: Build template codegen
        run: moon build template_codegen --target native

      - name: Install template codegen
        run: |
          mkdir -p "$HOME/.moon/bin"
          cp _build/native/debug/build/justjavac/template_codegen/template_codegen "$HOME/.moon/bin/template_codegen"
          chmod +x "$HOME/.moon/bin/template_codegen"

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Coverage
        run: moon coverage analyze -- -f cobertura -o coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
